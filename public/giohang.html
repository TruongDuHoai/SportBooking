<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .cart-page {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .cart-header {
            margin-bottom: 25px;
        }

        .cart-header h2 {
            color: #1a6b30;
            font-size: 30px;
        }

        .cart-header p {
            color: #666;
            margin-top: 6px;
        }

        .cart-empty {
            background: white;
            padding: 55px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .cart-empty i {
            font-size: 46px;
            color: #ff9800;
            margin-bottom: 15px;
        }

        .cart-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            overflow: hidden;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }

        .cart-table th {
            background: #f6f7f5;
            color: #1a6b30;
            text-align: left;
            padding: 16px;
        }

        .cart-table td {
            padding: 16px;
            border-bottom: 1px solid #eee;
            color: #333;
        }

        .cart-item-info h4 {
            color: #1a6b30;
            margin-bottom: 5px;
        }

        .cart-item-info small {
            color: #777;
        }

        .cart-remove {
            border: none;
            background: #fff0f0;
            color: #e74c3c;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-remove:hover {
            background: #e74c3c;
            color: white;
        }

        .cart-total {
            background: white;
            margin-top: 22px;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            text-align: right;
        }

        .cart-total h3 {
            color: #333;
        }

        .cart-total .total-price {
            color: #ff9800;
            font-size: 28px;
            font-weight: bold;
        }

        .btn-continue,
        .btn-checkout {
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 18px;
        }

        .btn-continue {
            background: #ff9800;
            margin-right: 10px;
        }

        .btn-checkout {
            background: #1a6b30;
        }

        .btn-continue:hover {
            background: #e68900;
        }

        .btn-checkout:hover {
            background: #0d4620;
        }

        @media(max-width: 768px) {
            .cart-table,
            .cart-table thead,
            .cart-table tbody,
            .cart-table th,
            .cart-table td,
            .cart-table tr {
                display: block;
            }

            .cart-table thead {
                display: none;
            }

            .cart-table tr {
                padding: 15px;
                border-bottom: 1px solid #eee;
            }

            .cart-table td {
                border: none;
                padding: 8px 0;
            }

            .cart-total {
                text-align: left;
            }

            .btn-continue,
            .btn-checkout {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration:none;color:white;">
                <h1>SportBooking</h1>
            </a>
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="chitiet.html?id=san1">Đặt sân</a>
            <a href="doan.html">Đặt đồ ăn</a>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="lichsu.html">Lịch sử</a>
            <a href="lienhe.html">Liên hệ</a>

            <div id="notificationBox" style="position:relative;display:none;">
                <a href="#" id="notificationBell" style="position:relative;">
                    <i class="fas fa-bell"></i>
                    <span id="notificationBadge"
                        style="
                            display:none;
                            position:absolute;
                            top:-8px;
                            right:-10px;
                            background:red;
                            color:white;
                            font-size:11px;
                            padding:2px 6px;
                            border-radius:50%;
                        ">
                        0
                    </span>
                </a>

                <div id="notificationDropdown"
                    style="
                        display:none;
                        position:absolute;
                        right:0;
                        top:35px;
                        width:320px;
                        background:white;
                        color:#333;
                        border-radius:10px;
                        box-shadow:0 5px 20px rgba(0,0,0,.15);
                        z-index:999;
                        overflow:hidden;
                    ">
                    <div style="padding:12px;font-weight:bold;border-bottom:1px solid #eee;">
                        Thông báo
                    </div>

                    <div id="notificationList" style="max-height:350px;overflow-y:auto;">
                        <p style="padding:15px;color:#777;">Chưa có thông báo.</p>
                    </div>
                </div>
            </div>

            <div style="position:relative; display:inline-block;" id="userMenu">
                <a href="#" id="loginBtn">Đăng nhập</a>

                <div id="userDropdownArea" style="display:none; position:relative;">
                    <a href="#" id="userInfoBtn">Tài khoản</a>

                    <div id="dropdownMenu" style="display:none; position:absolute; right:0; top:100%; background:white; min-width:130px; box-shadow:0 2px 8px rgba(0,0,0,0.2); border-radius:8px; z-index:100;">
                        <a href="taikhoan.html" style="display:block; padding:10px; color:#333; text-decoration:none; border-bottom:1px solid #eee;">Thông tin</a>
                        <a href="#" id="logoutDropdownBtn" style="display:block; padding:10px; color:#e74c3c; text-decoration:none;">Đăng xuất</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-header">
            <h2>Giỏ hàng của bạn</h2>
            <p>Kiểm tra lại khung giờ đặt sân trước khi thanh toán.</p>
        </div>

        <div id="cartContent">
            <div class="cart-empty">
                <i class="fa-solid fa-spinner"></i>
                <p>Đang tải giỏ hàng...</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/giohang.js"></script>
</body>
</html>
