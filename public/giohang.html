<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - SportBooking</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .cart-title {
            color: #1a6b30;
            margin-bottom: 20px;
        }
        .cart-empty {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 10px;
        }
        .cart-table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cart-table th, .cart-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .cart-table th {
            background: #f5f5f5;
        }
        .cart-item-info h4 {
            margin-bottom: 5px;
        }
        .cart-remove {
            color: #e74c3c;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 18px;
        }
        .cart-total {
            text-align: right;
            padding: 20px;
            background: white;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cart-total .total-price {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
        }
        .btn-checkout {
            background: #1a6b30;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-checkout:hover {
            background: #0d4620;
        }
        .btn-continue {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        @media (max-width: 768px) {
            .cart-table th, .cart-table td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: white;">
                <h1>SportBooking</h1>
            </a>
        </div>
        <nav>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="lichsu.html">Lịch sử</a>
            <div style="position:relative; display:inline-block;" id="userMenu">
                <a href="#" id="loginBtn">Đăng nhập</a>
                <div id="userDropdownArea" style="display:none; position:relative;">
                    <a href="#" id="userInfoBtn">Tài khoản</a>
                    <div id="dropdownMenu" style="display:none; position:absolute; right:0; top:100%; background:white; min-width:120px; box-shadow:0 2px 5px rgba(0,0,0,0.2); border-radius:5px; z-index:100;">
                        <a href="taikhoan.html" style="display:block; padding:10px; color:#333; text-decoration:none; border-bottom:1px solid #eee;">Thông tin</a>
                        <a href="#" id="logoutDropdownBtn" style="display:block; padding:10px; color:#e74c3c; text-decoration:none;">Đăng xuất</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="cart-container">
        <h2 class="cart-title">Giỏ hàng của bạn</h2>
        <div id="cartContent">
            <div class="cart-empty">
                <p>Đang tải...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0qNvl-i24wG9wOH-ajLu77MxNFvMvwjU",
            authDomain: "thue-san-the-thao.firebaseapp.com",
            projectId: "thue-san-the-thao",
            storageBucket: "thue-san-the-thao.firebasestorage.app",
            messagingSenderId: "90803956356",
            appId: "1:90803956356:web:7c63edc595f6ad25acb0d1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;

        function hienThiGioHang(cartItems) {
            const container = document.getElementById('cartContent');
            
            if (!cartItems || cartItems.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <p>Giỏ hàng của bạn đang trống.</p>
                        <a href="san.html" style="color: #1a6b30;">Tiếp tục mua sắm</a>
                    </div>
                `;
                return;
            }
            
            let total = 0;
            let html = `
                <table class="cart-table">
                    <thead>
                        <tr><th>Sản phẩm</th><th>Đơn giá</th><th>Ngày</th><th>Giờ</th><th>Thao tác</th></tr>
                    </thead>
                    <tbody>
            `;
            
            cartItems.forEach(item => {
                total += item.gia;
                html += `
                    <tr>
                        <td>
                            <div class="cart-item-info">
                                <h4>${item.tenSan}</h4>
                            </div>
                        </td>
                        <td>${item.gia.toLocaleString()}đ</td>
                        <td>${item.ngayDat || 'Chưa chọn'}</td>
                        <td>${item.gioBatDau ? item.gioBatDau + ':00' : 'Chưa chọn'}</td>
                        <td><button class="cart-remove" data-id="${item.id}">Xóa</button></td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
                <div class="cart-total">
                    <h3>Tổng tiền: <span class="total-price">${total.toLocaleString()}đ</span></h3>
                    <button class="btn-continue" onclick="window.location.href='san.html'">Tiếp tục đặt sân</button>
                    <button class="btn-checkout" onclick="window.location.href='thanhtoan.html'">Thanh toán</button>
                </div>
            `;
            
            container.innerHTML = html;
            
            // Xóa item
            document.querySelectorAll('.cart-remove').forEach(btn => {
                btn.onclick = async () => {
                    const itemId = btn.dataset.id;
                    const cartRef = doc(db, "carts", currentUser.uid);
                    const cartSnap = await getDoc(cartRef);
                    if (cartSnap.exists()) {
                        let items = cartSnap.data().items || [];
                        items = items.filter(i => i.id !== itemId);
                        await setDoc(cartRef, { items: items, updatedAt: new Date().toISOString() });
                        loadGioHang();
                    }
                };
            });
        }

        async function loadGioHang() {
            if (!currentUser) {
                document.getElementById('cartContent').innerHTML = `
                    <div class="cart-empty">
                        <p>Vui lòng đăng nhập để xem giỏ hàng.</p>
                        <a href="dangnhap.html" style="color: #1a6b30;">Đăng nhập ngay</a>
                    </div>
                `;
                return;
            }
            
            try {
                const cartRef = doc(db, "carts", currentUser.uid);
                const cartSnap = await getDoc(cartRef);
                
                if (!cartSnap.exists() || !cartSnap.data().items || cartSnap.data().items.length === 0) {
                    hienThiGioHang([]);
                    return;
                }
                
                const items = cartSnap.data().items;
                hienThiGioHang(items);
                
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('cartContent').innerHTML = '<p style="color:red;">Lỗi tải giỏ hàng: ' + error.message + '</p>';
            }
        }

        function kiemTraDangNhap() {
            const loginBtn = document.getElementById('loginBtn');
            const userDropdownArea = document.getElementById('userDropdownArea');
            const userInfoBtn = document.getElementById('userInfoBtn');
            const dropdownMenu = document.getElementById('dropdownMenu');
            const logoutDropdownBtn = document.getElementById('logoutDropdownBtn');
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    loginBtn.style.display = 'none';
                    userDropdownArea.style.display = 'inline-block';
                    
                    userInfoBtn.onclick = (e) => {
                        e.preventDefault();
                        dropdownMenu.style.display = dropdownMenu.style.display === 'none' ? 'block' : 'none';
                    };
                    
                    document.addEventListener('click', function closeDropdown(e) {
                        if (!userDropdownArea.contains(e.target)) {
                            dropdownMenu.style.display = 'none';
                        }
                    });
                    
                    if (logoutDropdownBtn) {
                        logoutDropdownBtn.onclick = async (e) => {
                            e.preventDefault();
                            await signOut(auth);
                            alert('Đã đăng xuất!');
                            window.location.reload();
                        };
                    }
                    
                    loadGioHang();
                } else {
                    currentUser = null;
                    loginBtn.style.display = 'inline-block';
                    userDropdownArea.style.display = 'none';
                    loginBtn.onclick = (e) => {
                        e.preventDefault();
                        window.location.href = 'dangnhap.html';
                    };
                    loadGioHang();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            kiemTraDangNhap();
        });
    </script>
</body>
</html>
