        let currentSanId = null;
        let selectedCalendarSlots = [];

function clearSelectedCalendarSlots() {
    selectedCalendarSlots = [];

    document
        .querySelectorAll(".multi-book-slot")
        .forEach((slot) => {
            slot.classList.remove("slot-selected");
        });

    updateSelectedSlotsBar();
}

function toggleCalendarSlot(slot, tenSan) {
    const date = slot.dataset.date;
    const hour = Number(slot.dataset.hour);
    const price = Number(slot.dataset.price || 0);

    const existingIndex =
        selectedCalendarSlots.findIndex(
            (item) =>
                item.date === date &&
                item.hour === hour
        );

    if (existingIndex >= 0) {
        const selectedHours =
            selectedCalendarSlots
                .map((item) => item.hour)
                .sort((a, b) => a - b);

        const minHour = selectedHours[0];
        const maxHour =
            selectedHours[selectedHours.length - 1];

        if (
            selectedHours.length > 2 &&
            hour !== minHour &&
            hour !== maxHour
        ) {
            alert(
                "Chỉ có thể bỏ chọn khung giờ ở đầu hoặc cuối!"
            );
            return;
        }

        selectedCalendarSlots.splice(
            existingIndex,
            1
        );

        slot.classList.remove("slot-selected");
        updateSelectedSlotsBar();
        return;
    }

    if (selectedCalendarSlots.length > 0) {
        const sameDate =
            selectedCalendarSlots.every(
                (item) => item.date === date
            );

        if (!sameDate) {
            alert(
                "Bạn chỉ được chọn nhiều khung giờ trong cùng một ngày!"
            );
            return;
        }

        const selectedHours =
            selectedCalendarSlots
                .map((item) => item.hour)
                .sort((a, b) => a - b);

        const minHour = selectedHours[0];
        const maxHour =
            selectedHours[selectedHours.length - 1];

        if (
            hour !== minHour - 1 &&
            hour !== maxHour + 1
        ) {
            alert(
                "Các khung giờ phải liên tiếp nhau. Ví dụ: 6h, 7h, 8h."
            );
            return;
        }
    }

    selectedCalendarSlots.push({
        date,
        hour,
        price,
        tenSan
    });

    selectedCalendarSlots.sort(
        (a, b) => a.hour - b.hour
    );

    slot.classList.add("slot-selected");
    updateSelectedSlotsBar();
}

function updateSelectedSlotsBar() {
    const bar =
        document.getElementById(
            "multiBookingBar"
        );

    const summary =
        document.getElementById(
            "selectedSlotsSummary"
        );

    if (!bar || !summary) {
        return;
    }

    if (selectedCalendarSlots.length === 0) {
        bar.style.display = "none";
        summary.textContent = "";
        return;
    }

    const slots = [...selectedCalendarSlots]
        .sort((a, b) => a.hour - b.hour);

    const startHour = slots[0].hour;
    const endHour =
        slots[slots.length - 1].hour + 1;

    const totalPrice =
        slots.reduce(
            (total, item) =>
                total + Number(item.price || 0),
            0
        );

    const displayDate =
        slots[0].date
            .split("-")
            .reverse()
            .join("/");

    summary.innerHTML = `
        <strong>${slots[0].tenSan}</strong>
        &nbsp;|&nbsp;

function setMonday(date) {
    const newDate = new Date(date);
    const day = newDate.getDay();

    const difference =
        newDate.getDate() -
        day +
        (day === 0 ? -6 : 1);

    newDate.setDate(difference);
    newDate.setHours(0, 0, 0, 0);

    return newDate;
}

async function renderWeeklyGrid() {
    const grid =
        document.getElementById("calendarGrid");

    const weekDisplay =
        document.getElementById("weekDisplay");

    if (!grid || !weekDisplay) {
        return;
    }

    if (!currentSanId) {
        grid.innerHTML = `
            <div style="
                background: white;
                padding: 40px;
                text-align: center;
                border-radius: 12px;
                color: #64748b;
            ">
                Vui lòng chọn một sân.
            </div>
        `;

        return;
    }

    if (unsubscribeCalendar) {
        unsubscribeCalendar();
        unsubscribeCalendar = null;
    }

    grid.innerHTML = `
        <div class="loading">
            <i class="fas fa-circle-notch fa-spin"></i>
            Đang tải lịch tuần...
        </div>
    `;

    try {
        const sanSnapshot = await getDoc(
            doc(db, "san", currentSanId)
        );

        if (!sanSnapshot.exists()) {
            grid.innerHTML = `
                <div style="
                    background: #fee2e2;
                    color: #991b1b;
                    padding: 20px;
                    border-radius: 10px;
                ">
                    Không tìm thấy thông tin sân.
                </div>
            `;

            return;
        }

        const sanData = sanSnapshot.data();

        const tenSan =
            sanData.ten ||
            sanData.tenSan ||
            "Sân chưa đặt tên";

        const baseGia = Number(sanData.gia || 0);

        const daysOfWeek = [];

        const dayLabels = [
            "Thứ 2",
            "Thứ 3",
            "Thứ 4",
            "Thứ 5",
            "Thứ 6",
            "Thứ 7",
            "Chủ Nhật"
        ];

        for (let index = 0; index < 7; index++) {
            const date = new Date(startOfWeekDate);

            date.setDate(
                startOfWeekDate.getDate() + index
            );

            const year = date.getFullYear();
            const month = String(
                date.getMonth() + 1
            ).padStart(2, "0");
            const day = String(
                date.getDate()
            ).padStart(2, "0");

            daysOfWeek.push({
                dateStr: `${year}-${month}-${day}`,
                label: dayLabels[index],
                displayDate: `${day}/${month}`
            });
        }

        weekDisplay.textContent =
            `${daysOfWeek[0].displayDate} - ` +
            `${daysOfWeek[6].displayDate}`;

        const bookingQuery = query(
            collection(db, "donDat"),
            where("sanId", "==", currentSanId)
        );

        unsubscribeCalendar = onSnapshot(
            bookingQuery,
            (snapshot) => {
                const bookingMap = new Map();

                snapshot.forEach((docSnap) => {
                    const booking = {
                        ...docSnap.data(),
                        id: docSnap.id
                    };

                    if (booking.trangThai === "đã_hủy") {
                        return;
                    }

                    const startHour = Number(
                        booking.gioBatDau
                    );

                    const endHourValue = Number(
                        booking.gioKetThuc
                    );

                    if (
                        !booking.ngayDat ||
                        !Number.isFinite(startHour)
                    ) {
                        return;
                    }

                    const endHour =
                        Number.isFinite(endHourValue) &&
                        endHourValue > startHour
                            ? endHourValue
                            : startHour + 1;

                    for (
                        let occupiedHour = startHour;
                        occupiedHour < endHour;
                        occupiedHour++
                    ) {
                        bookingMap.set(
                            `${booking.ngayDat}_${occupiedHour}`,
                            booking
                        );
                    }
                });

                selectedCalendarSlots =
                    selectedCalendarSlots.filter((slot) => {
                        return !bookingMap.has(
                            `${slot.date}_${slot.hour}`
                        );
                    });

                const escapeHTML = (value) => {

                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/\"/g, "&quot;")
                        .replace(/'/g, "&#039;");

                const hours = [];

                for (let hour = 6; hour <= 22; hour++) {
                    hours.push(hour);

                `;

                daysOfWeek.forEach((day) => {
                    html += `
                        <th>
                            <div>${day.label}</div>

                                color: #64748b;

                            </div>
                        </th>
                    `;
                });

                html += `
                                </tr>
                            </thead>
                            <tbody>
                `;

                hours.forEach((hour) => {
                    html += `
                        <tr>
                            <td class="time-cell">
                                ${String(hour).padStart(2, "0")}:00
                            </td>
                    `;

                    daysOfWeek.forEach((day) => {
                        const key =
                            `${day.dateStr}_${hour}`;

                        const booking =
                            bookingMap.get(key);

                        if (!booking) {
                            const isSelected =
                                selectedCalendarSlots.some(
                                    (item) =>
                                        item.date === day.dateStr &&
                                        item.hour === hour
                                );

                            html += `
                                <td
                                    class="slot-available multi-book-slot ${
                                        isSelected
                                            ? "slot-selected"
                                            : ""
                                    }"
                                    data-date="${day.dateStr}"
                                    data-hour="${hour}"
                                    data-price="${baseGia}"
                                    title="Chọn ${hour}:00 - ${hour + 1}:00"
                                >
                                    <i class="fas fa-plus-circle"></i>
                                    <div style="
                                        margin-top: 3px;
                                        font-size: 10px;
                                    ">
                                        Chọn
                                    </div>
                                </td>
                            `;

                            return;
                        }

                        const isPending =
                            booking.trangThai === "chờ_xác_nhận" ||
                            booking.trangThai === "Chờ xác nhận";

                        const isWaitingPayment =
                            booking.trangThaiThanhToan === "Chờ xác nhận thanh toán" ||
                            booking.trangThaiThanhToan === "Chờ thanh toán";

                        let statusClass = "slot-confirmed";
                        let statusText = "Đã xác nhận";

                        if (isPending) {
                            statusClass = "slot-pending";
                            statusText = "Chờ xác nhận";
                        }

                        if (isWaitingPayment) {
                            statusClass = "slot-pending";
                            statusText = "Chờ TT";
                        }

                        const customerName =
                            booking.userName ||
                            booking.userEmail ||
                            "Khách hàng";

                        html += `
                            <td
                                class="${statusClass} booked-calendar-slot"
                                data-booking-key="${key}"
                                title="Bấm để xem chi tiết"
                                style="cursor:pointer;"
                            >
                                <div style="font-weight:700;">
                                    ${statusText}
                                </div>

                                <div style="
                                    margin-top:3px;
                                    font-size:10px;
                                    overflow:hidden;
                                    text-overflow:ellipsis;
                                    white-space:nowrap;
                                ">
                                    ${escapeHTML(customerName)}
                                    <br>
                                    <span style="font-size:9px;">
                                        ${escapeHTML(booking.trangThaiThanhToan || "Chưa thanh toán")}
                                    </span>
                                </div>
                            </td>
                        `;
                    });

                    html += `</tr>`;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                grid.innerHTML = html;

                grid
                    .querySelectorAll(".multi-book-slot")
                    .forEach((slot) => {
                        slot.addEventListener("click", () => {
                            toggleCalendarSlot(slot, tenSan);
                        });
                    });

                grid
                    .querySelectorAll(".booked-calendar-slot")
                    .forEach((slot) => {
                        slot.addEventListener("click", () => {
                            const booking = bookingMap.get(
                                slot.dataset.bookingKey
                            );

                            if (!booking) {
                                return;
                            }

                            window.showBookingDetail(
                                booking.id,
                                booking.tenSan || tenSan,
                                booking.ngayDat,
                                Number(booking.gioBatDau),
                                Number(booking.gioKetThuc) || Number(booking.gioBatDau) + 1,
                                Number(booking.tongTien || 0),
                                booking.trangThai,
                                booking.userName || booking.userEmail || "Khách hàng",
                                booking.userPhone || "---",
                                booking.trangThaiThanhToan || "Chưa thanh toán",
                                booking.phuongThucThanhToan || "Không rõ",
                                booking.maThanhToan || ""
                            );
                            
                        });
                    });

                updateSelectedSlotsBar();
            },
            (error) => {
                console.error(
                    "Lỗi theo dõi lịch:",
                    error

                grid.innerHTML = `
                    <div style="
                        background:#fee2e2;

    } catch (error) {

                        "sanId",
                        "==",
                        sanIdDaChon
                    )
                );

                const bookingSnapshot =
                    await getDocs(bookingQuery);

                let biTrungLich = false;

                bookingSnapshot.forEach(
                    (docSnap) => {
                        const booking =
                            docSnap.data();

                        if (
                            booking.trangThai ===
                            "đã_hủy"
                        ) {
                            return;
                        }

                        if (
                            booking.ngayDat !==
                            ngayDat
                        ) {
                            return;
                        }

                        const oldStart = Number(
                            booking.gioBatDau
                        );

                        const oldEndValue = Number(
                            booking.gioKetThuc
                        );

                        const oldEnd =
                            Number.isFinite(
                                oldEndValue
                            ) &&
                            oldEndValue > oldStart
                                ? oldEndValue
                                : oldStart + 1;

                        if (
                            gioBatDau < oldEnd &&
                            gioKetThuc > oldStart
                        ) {
                            biTrungLich = true;
                        }
                    }
                );

                if (biTrungLich) {
                    alert(
                        "Một trong các khung giờ đã có người đặt. Vui lòng tải lại lịch và chọn lại!"
                    );

                    modal.remove();
                    clearSelectedCalendarSlots();
                    return;
                }

                saveButton.textContent =
                    "Đang lưu đơn...";

                await addDoc(
                    collection(db, "donDat"),
                    {
                        sanId: sanIdDaChon,
                        tenSan: tenSan,

                        userId:
                            "admin_booking_" +
                            Date.now(),

                        userName: userName,
                        userPhone: userPhone,
                        userEmail: userEmail,

                        ngayDat: ngayDat,
                        gioBatDau: gioBatDau,
                        gioKetThuc: gioKetThuc,

                        soGio: soGio,
                        gia: giaMoiGio,
                        tongTien: tongTien,

                        trangThai: trangThai,

                        nguonDat: "admin",

                        createdBy:
                            auth.currentUser?.email ||
                            "admin",

                        createdAt: new Date(),
                        updatedAt: new Date()
                    }
                );

                alert(
                    `Đặt sân thành công từ ` +
                    `${String(gioBatDau).padStart(2, "0")}:00 ` +
                    `đến ` +
                    `${String(gioKetThuc).padStart(2, "0")}:00!`
                );

                modal.remove();
                clearSelectedCalendarSlots();

            } catch (error) {
                console.error(
                    "Lỗi Admin đặt nhiều giờ:",
                    error
                );

                alert(
                    "Không thể tạo đơn đặt sân: " +
                    error.message
                );

                saveButton.disabled = false;
                saveButton.textContent =
                    "Xác nhận đặt sân";
            }
        }
    );

    document
        .getElementById(
            "cancelAdminMultiBookingBtn"
        )
        .addEventListener("click", () => {
            modal.remove();
        });

    modal.addEventListener(
        "click",
        (event) => {
            if (event.target === modal) {
                modal.remove();
            }
        }
    );
}

        });

            modal.remove();
        }
    });

                    alert("Không tìm thấy đơn!");

                // Cập nhật trạng thái

                    trangThai: "đã_hủy",
                    updatedAt: new Date()
                });

                // Gửi thông báo cho khách
                await createNotification(
                    booking.userId,
                    "Đơn đặt sân đã bị hủy",
                    `Đơn đặt sân ${booking.tenSan} ngày ${booking.ngayDat} đã bị hủy.`

        };

                            ${Number(b.gioKetThuc || 0)},

                            '${b.trangThai || ""}',

                            '${b.userPhone || "---"}',

        async function showUserHistory(userId, userName) {
            const bookingsRef = collection(db, "donDat");
            const q = query(bookingsRef, where("userId", "==", userId), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);
            
            let html = `<div class="user-history"><h4>Lịch sử đặt sân của ${userName}</h4>`;
            if (snapshot.empty) {
                html += '<p>Chưa có đơn đặt sân nào.</p>';
            } else {
                snapshot.forEach(doc => {
                    const b = doc.data();
                    html += `<div class="history-item"><strong>${b.tenSan}</strong> - Ngày: ${b.ngayDat} - Giờ: ${b.gioBatDau}:00 - ${b.gioKetThuc}:00 - ${b.tongTien.toLocaleString()}đ - Trạng thái: ${b.trangThai}</div>`;
                });
            }
            html += `<button class="btn-add" id="closeHistoryBtn" style="margin-top:10px;">Đóng</button></div>`;
            
            const existingModal = document.querySelector('.modal');
            if (existingModal) existingModal.remove();
            
            const modal = document.createElement('div'); modal.className = 'modal'; modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-content" style="max-width:600px;">${html}</div>`;
            document.body.appendChild(modal);
            
            document.getElementById('closeHistoryBtn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

                ? a.createdAt.toDate().getTime()
                : 0;

                ? b.createdAt.toDate().getTime()
                : 0;

                .replaceAll("&", "&amp;")

                .replaceAll("'", "&#039;");
        };

            if (!value) {
                return "Không rõ";
            }

            let date;

            if (typeof value.toDate === "function") {
                date = value.toDate();
            } else {
                date = new Date(value);

                return "Không rõ";

            return date.toLocaleString("vi-VN");

                };
            }

            return {
                text: "Chờ duyệt",
                background: "#fef3c7",
                color: "#92400e"
            };
        };

        ).length;

            (item) => item.status === "approved"

                ...docSnap.data(),
                id: docSnap.id

        });

        const getTime = (value) => {
            if (!value) return 0;

            if (typeof value.toDate === "function") {
                return value.toDate().getTime();
            }

            const date = new Date(value);
            return Number.isNaN(date.getTime())
                ? 0
                : date.getTime();
        };

        feedbackList.sort(
            (a, b) =>
                getTime(b.createdAt) -
                getTime(a.createdAt)

        const escapeHTML = (value) => {
            return String(value ?? "")
                .replace(/&/g, "&amp;")

            </p>
        </div>

    try {
        const snapshot = await getDocs(
            collection(db, "donDat")
        );

        const bookings = snapshot.docs.map((docSnap) => {
            return {
                id: docSnap.id,
                ...docSnap.data()
            };
        });

        const confirmedBookings = bookings.filter(
            (booking) =>
                booking.trangThai === "đã_xác_nhận"
        );

        const reportMap = {};

        confirmedBookings.forEach((booking) => {
            const sanKey =
                booking.sanId ||
                booking.tenSan ||
                "khong_xac_dinh";

            if (!reportMap[sanKey]) {
                reportMap[sanKey] = {
                    sanId: booking.sanId || "",
                    tenSan:
                        booking.tenSan ||
                        "Không xác định",
                    soLuotDat: 0,
                    tongSoGio: 0,
                    doanhThu: 0
                };
            }

            const gioBatDau = Number(
                booking.gioBatDau
            );

            const gioKetThuc = Number(
                booking.gioKetThuc
            );

            let soGio = gioKetThuc - gioBatDau;

            if (
                !Number.isFinite(soGio) ||
                soGio <= 0
            ) {
                soGio = 1;
            }

            reportMap[sanKey].soLuotDat += 1;

            reportMap[sanKey].tongSoGio +=
                soGio;

            reportMap[sanKey].doanhThu +=
                Number(booking.tongTien || 0);

        const reportList = Object.values(
            reportMap

            if (b.soLuotDat !== a.soLuotDat) {

            return b.doanhThu - a.doanhThu;

                await updateDoc(

                    {

                        updatedAt: new Date()

                );

                alert("Đã lưu ghi chú!");

            } catch (error) {

                    error.message

    document
        .getElementById(
            "processFeedbackModalBtn"
        )

            const adminNote = document
                .getElementById("feedbackAdminNote")
                .value
                .trim();

            try {
                await updateDoc(
                    doc(db, "feedback", feedbackId),
                    {
                        status: "processed",
                        adminNote: adminNote,
                        processedAt: new Date(),
                        processedBy:
                            auth.currentUser?.email ||
                            "admin",
                        updatedAt: new Date()
                    }
                );

                alert("Phản hồi đã được xử lý!");

                modal.remove();
                loadFeedback();

                    error
                );

                alert(
                    "Không thể xử lý phản hồi: " +
                    error.message
                );
            }
        });

    document
        .getElementById("closeFeedbackModalBtn")
        .addEventListener("click", () => {
            modal.remove();
            loadFeedback();
        });

    modal.addEventListener("click", (event) => {
        if (event.target === modal) {
            modal.remove();
            loadFeedback();
        }
    });
}
