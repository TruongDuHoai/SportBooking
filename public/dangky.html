<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
            background: linear-gradient(135deg, #f6f7f5, #eef7f0);
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 34px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header .icon {
            width: 64px;
            height: 64px;
            background: #fff3e0;
            color: #ff9800;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
            font-weight: bold;
        }

        .auth-header h2 {
            color: #1a6b30;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #666;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a6b30;
            box-shadow: 0 0 0 3px rgba(26,107,48,0.12);
        }

        .btn-submit {
            width: 100%;
            background: #1a6b30;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #0d4620;
        }

        .auth-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }

        .auth-link a {
            color: #1a6b30;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error-message,
        .success-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        .error-message {
            background: #fdecea;
            color: #c0392b;
        }

        .success-message {
            background: #e8f7ed;
            color: #1a6b30;
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 24px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration:none;color:white;">
                <h1>SportBooking</h1>
            </a>
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="chitiet.html?id=san1">Đặt sân</a>
            <a href="doan.html">Đặt đồ ăn</a>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="lichsu.html">Lịch sử</a>
            <a href="dangnhap.html">Đăng nhập</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="icon">SB</div>
                <h2>Đăng ký tài khoản</h2>
                <p>Tạo tài khoản để đặt sân, thanh toán và theo dõi lịch sử đặt sân.</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="fullName" placeholder="Nhập họ tên của bạn" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="phone" placeholder="0987654321">
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Ít nhất 6 ký tự" required>
                </div>

                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>

                <button type="submit" class="btn-submit">Đăng ký</button>
            </form>

            <div class="auth-link">
                Đã có tài khoản? <a href="dangnhap.html">Đăng nhập ngay</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0qNvl-i24wG9wOH-ajLu77MxNFvMvwjU",
            authDomain: "thue-san-the-thao.firebaseapp.com",
            projectId: "thue-san-the-thao",
            storageBucket: "thue-san-the-thao.firebasestorage.app",
            messagingSenderId: "90803956356",
            appId: "1:90803956356:web:7c63edc595f6ad25acb0d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById("registerForm");
        const errorDiv = document.getElementById("errorMessage");
        const successDiv = document.getElementById("successMessage");

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            successDiv.style.display = "none";

            setTimeout(() => {
                errorDiv.style.display = "none";
            }, 5000);
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = "block";
            errorDiv.style.display = "none";
        }

        function validatePhone(phone) {
            if (!phone) return true;
            return /^0[0-9]{9}$/.test(phone);
        }

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!fullName) {
                showError("Vui lòng nhập họ tên");
                return;
            }

            if (!email) {
                showError("Vui lòng nhập email");
                return;
            }

            if (!validatePhone(phone)) {
                showError("Số điện thoại không hợp lệ. Vui lòng nhập 10 số và bắt đầu bằng số 0.");
                return;
            }

            if (password.length < 6) {
                showError("Mật khẩu phải có ít nhất 6 ký tự");
                return;
            }

            if (password !== confirmPassword) {
                showError("Mật khẩu xác nhận không khớp");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await updateProfile(user, {
                    displayName: fullName
                });

                await setDoc(doc(db, "users", user.uid), {
                    fullName,
                    email,
                    phone,
                    createdAt: new Date().toISOString(),
                    role: "user"
                });

                showSuccess("Đăng ký thành công! Đang chuyển hướng...");

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                let errorMessage = "Đăng ký thất bại. Vui lòng thử lại.";

                switch (error.code) {
                    case "auth/email-already-in-use":
                        errorMessage = "Email này đã được đăng ký. Vui lòng dùng email khác.";
                        break;
                    case "auth/invalid-email":
                        errorMessage = "Email không hợp lệ.";
                        break;
                    case "auth/weak-password":
                        errorMessage = "Mật khẩu quá yếu.";
                        break;
                }

                showError(errorMessage);
            }
        });
    </script>
</body>
</html>
