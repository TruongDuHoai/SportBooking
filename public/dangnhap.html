<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
            background: linear-gradient(135deg, #f6f7f5, #eef7f0);
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 34px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header .icon {
            width: 64px;
            height: 64px;
            background: #e8f7ed;
            color: #1a6b30;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
            font-weight: bold;
        }

        .auth-header h2 {
            color: #1a6b30;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #666;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a6b30;
            box-shadow: 0 0 0 3px rgba(26,107,48,0.12);
        }

        .btn-submit {
            width: 100%;
            background: #1a6b30;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #0d4620;
        }

        .auth-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }

        .auth-link a {
            color: #1a6b30;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            font-weight: 600;
            font-size: 14px;
            background: #fdecea;
            color: #c0392b;
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 24px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration:none;color:white;">
                <h1>SportBooking</h1>
            </a>
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="chitiet.html?id=san1">Đặt sân</a>
            <a href="doan.html">Đặt đồ ăn</a>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="lichsu.html">Lịch sử</a>
            <a href="dangky.html">Đăng ký</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="icon">SB</div>
                <h2>Đăng nhập</h2>
                <p>Đăng nhập để tiếp tục đặt sân và quản lý đơn của bạn.</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="btn-submit">Đăng nhập</button>
            </form>

            <div class="auth-link">
                Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0qNvl-i24wG9wOH-ajLu77MxNFvMvwjU",
            authDomain: "thue-san-the-thao.firebaseapp.com",
            projectId: "thue-san-the-thao",
            storageBucket: "thue-san-the-thao.firebasestorage.app",
            messagingSenderId: "90803956356",
            appId: "1:90803956356:web:7c63edc595f6ad25acb0d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById("loginForm");
        const errorDiv = document.getElementById("errorMessage");

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = "block";

            setTimeout(() => {
                errorDiv.style.display = "none";
            }, 5000);
        }

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showError("Vui lòng nhập đầy đủ email và mật khẩu");
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userSnap = await getDoc(doc(db, "users", user.uid));

                if (userSnap.exists() && userSnap.data().isActive === false) {
                    await signOut(auth);
                    alert("Tài khoản của bạn đã bị khóa!");
                    return;
                }

                const userDoc = await getDoc(doc(db, "users", user.uid));

                let role = "user";

                if (userDoc.exists()) {
                    role = userDoc.data().role || "user";
                }

                alert("Đăng nhập thành công!");

                if (role === "admin" || role === "staff") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "index.html";
                }

            } catch (error) {
                let errorMessage = "Đăng nhập thất bại";

                switch (error.code) {
                    case "auth/invalid-credential":
                        errorMessage = "Sai email hoặc mật khẩu";
                        break;
                    case "auth/user-not-found":
                        errorMessage = "Email chưa được đăng ký";
                        break;
                    case "auth/wrong-password":
                        errorMessage = "Sai mật khẩu";
                        break;
                }

                showError(errorMessage);
            }
        });
    </script>
</body>
</html>
