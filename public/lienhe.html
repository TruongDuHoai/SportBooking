<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .contact-container{
            max-width:1200px;
            margin:40px auto;
            padding:0 20px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;
        }

        .contact-card{
            background:white;
            padding:30px;
            border-radius:18px;
            box-shadow:0 8px 20px rgba(0,0,0,.06);
        }

        .contact-card h2{
            color:#1a6b30;
            margin-bottom:20px;
        }

        .contact-card p{
            margin:14px 0;
            color:#666;
        }

        .contact-form input,
        .contact-form textarea,
        .contact-form select{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            margin-bottom:14px;
        }

        .btn-submit{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#1a6b30;
            color:white;
            font-weight:600;
            cursor:pointer;
        }

        .btn-submit:hover{
            background:#0d4620;
        }

        #resultMsg{
            margin-top:15px;
            text-align:center;
            font-weight:600;
        }

        .map{
            margin-top:20px;
            overflow:hidden;
            border-radius:14px;
        }

        @media(max-width:768px){
            .contact-container{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration:none;color:white;">
            <h1>SportBooking</h1>
        </a>
    </div>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="chitiet.html?id=san1">Đặt sân</a>
        <a href="doan.html">Đặt đồ ăn</a>
        <a href="giohang.html">Giỏ hàng</a>
        <a href="lichsu.html">Lịch sử</a>
        <a href="lienhe.html">Liên hệ</a>

        <div id="userMenu" style="position:relative;display:inline-block;">
            <a href="#" id="loginBtn">Đăng nhập</a>

            <div id="userDropdownArea" style="display:none;position:relative;">
                <a href="#" id="userInfoBtn">Tài khoản</a>

                <div id="dropdownMenu" style="display:none;position:absolute;right:0;top:100%;background:white;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:140px;">
                    <a href="taikhoan.html" style="display:block;padding:12px;color:#333;text-decoration:none;">Thông tin</a>
                    <a href="#" id="logoutBtn" style="display:block;padding:12px;color:#e74c3c;text-decoration:none;">Đăng xuất</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<div class="contact-container">

    <div class="contact-card">
        <h2>Thông tin liên hệ</h2>

        <p><strong>Địa chỉ:</strong> 123 Nguyễn Du, Quận 1, TP.HCM</p>
        <p><strong>Hotline:</strong> 1900 1234</p>
        <p><strong>Email:</strong> support@sportbooking.com</p>
        <p><strong>Giờ làm việc:</strong> 08:00 - 21:00</p>

        <div class="map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18..."
                width="100%"
                height="250"
                style="border:0;"
                loading="lazy">
            </iframe>
        </div>
    </div>

    <div class="contact-card contact-form">
        <h2>Gửi liên hệ</h2>

        <input type="text" id="hoTen" placeholder="Họ tên">
        <input type="email" id="email" placeholder="Email">
        <input type="tel" id="soDienThoai" placeholder="Số điện thoại">

        <select id="chuDe">
            <option value="">-- Chọn chủ đề --</option>
            <option value="Hỏi giá sân">Hỏi giá sân</option>
            <option value="Hỗ trợ đặt sân">Hỗ trợ đặt sân</option>
            <option value="Khiếu nại">Khiếu nại</option>
            <option value="Góp ý dịch vụ">Góp ý dịch vụ</option>
        </select>

        <textarea id="noiDung" rows="5" placeholder="Nội dung liên hệ..."></textarea>

        <button id="sendBtn" class="btn-submit">Gửi liên hệ</button>

        <div id="resultMsg"></div>
    </div>

</div>

<script type="module" src="js/lienhe.js"></script>

</body>
</html>
