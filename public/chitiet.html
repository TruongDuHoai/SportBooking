<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sân - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .detail-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: start;
        }

        .detail-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 20px;
        }

        .detail-info {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .detail-info h2 {
            color: #1a6b30;
            margin-bottom: 15px;
        }

        .detail-price {
            font-size: 28px;
            font-weight: bold;
            color: #ff9800;
            margin: 15px 0;
        }

        .detail-meta {
            margin: 10px 0;
            color: #555;
        }

        .booking-form {
            margin-top: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
        }

        .booking-form h3 {
            margin-bottom: 20px;
            color: #1a6b30;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .form-group input,
        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-slot-label {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: .2s;
        }

        .time-slot-label:hover {
            background: #1a6b30;
            color: white;
        }

        .time-slot-label.selected {
            background: #1a6b30;
            color: white;
        }

        .time-slot-label.booked {
            background: #ddd;
            cursor: not-allowed;
        }

        .time-slot-label input {
            display: none;
        }

        .btn-book {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-book:hover {
            background: #e68900;
        }

        .btn-favorite {
            background: #e91e63;
        }

        .btn-favorite:hover {
            background: #c2185b;
        }

        .total-price {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1a6b30;
        }

        .map-container {
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 250px;
            border: none;
        }

        .review-section {
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .review-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .review-stars {
            color: #ff9800;
        }

        .review-email {
            font-weight: bold;
            color: #1a6b30;
        }

        .review-date {
            font-size: 13px;
            color: #888;
        }

        @media(max-width:768px) {
            .detail-container {
                grid-template-columns: 1fr;
            }

            .time-slots-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-image img {
                height: 280px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration:none;color:white;">
            <h1>SportBooking</h1>
        </a>
    </div>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="giohang.html">Giỏ hàng</a>
        <a href="lichsu.html">Lịch sử</a>
        <a href="lienhe.html">Liên hệ</a>
        <a href="#" id="loginBtn">Đăng nhập</a>
        <a href="taikhoan.html" id="userInfoBtn" style="display:none;">Tài khoản</a>
    </nav>
</header>

<div class="detail-page">
    <div class="detail-container" id="detailContainer">
        <p>Đang tải dữ liệu...</p>
    </div>
</div>

<script type="module" src="js/chitiet.js"></script>

</body>
</html>
