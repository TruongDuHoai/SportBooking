<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sân - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .detail-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: start;
        }

        .detail-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 20px;
        }

        .detail-info {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .detail-info h2 {
            color: #1a6b30;
            margin-bottom: 15px;
        }

        .detail-price {
            font-size: 28px;
            font-weight: bold;
            color: #ff9800;
            margin: 15px 0;
        }

        .detail-meta {
            margin: 10px 0;
            color: #555;
        }

        .booking-form {
            margin-top: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
        }

        .booking-form h3 {
            margin-bottom: 20px;
            color: #1a6b30;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .form-group input,
        .review-form select,
        .review-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-slot-label {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: .2s;
        }

        .time-slot-label:hover {
            background: #1a6b30;
            color: white;
        }

        .time-slot-label.selected {
            background: #1a6b30;
            color: white;
        }

        .time-slot-label.booked {
            background: #ddd;
            cursor: not-allowed;
        }

        .time-slot-label input {
            display: none;
        }

        .btn-book {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-book:hover {
            background: #e68900;
        }

        .btn-favorite {
            background: #e91e63;
        }

        .btn-favorite:hover {
            background: #c2185b;
        }

        .total-price {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1a6b30;
        }

        .map-container {
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 250px;
            border: none;
        }

        .review-section {
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .review-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .review-stars {
            color: #ff9800;
        }

        .review-email {
            font-weight: bold;
            color: #1a6b30;
        }

        .review-date {
            font-size: 13px;
            color: #888;
        }

        @media(max-width:768px) {
            .detail-container {
                grid-template-columns: 1fr;
            }

            .time-slots-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-image img {
                height: 280px;
            }
        }
        .time-slot-label.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #ddd;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration:none;color:white;">
            <h1>SportBooking</h1>
        </a>
    </div>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="giohang.html">Giỏ hàng</a>
        <a href="lichsu.html">Lịch sử</a>
        <a href="lienhe.html">Liên hệ</a>

        <div id="notificationBox" style="position:relative;display:none;margin-right:15px;">
            <a href="#" id="notificationBell" style="position:relative;color:white;font-size:20px;">
                <i class="fas fa-bell"></i>

                <span id="notificationBadge"
                    style="
                        display:none;
                        position:absolute;
                        top:-8px;
                        right:-8px;
                        background:red;
                        color:white;
                        min-width:18px;
                        height:18px;
                        border-radius:50%;
                        font-size:11px;
                        justify-content:center;
                        align-items:center;
                    ">
                    0
                </span>
            </a>

            <div id="notificationDropdown"
                style="
                    display:none;
                    position:absolute;
                    right:0;
                    top:35px;
                    width:330px;
                    background:white;
                    color:#333;
                    border-radius:10px;
                    box-shadow:0 8px 20px rgba(0,0,0,.2);
                    z-index:9999;
                    overflow:hidden;
                ">
                <div style="padding:12px;font-weight:bold;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
                    <span>Thông báo</span>
                    <button id="markAllNotificationsReadBtn" style="border:none;background:none;color:#1a6b30;cursor:pointer;">
                        Đánh dấu tất cả
                    </button>
                </div>

                <div id="notificationList" style="max-height:350px;overflow-y:auto;">
                    <p style="padding:15px;color:#777;">Chưa có thông báo.</p>
                </div>
            </div>
        </div>

        <a href="dangnhap.html" id="loginBtn">Đăng nhập</a>

        <div id="userDropdownArea" style="display:none;position:relative;">
            <a href="#" id="userInfoBtn">Tài khoản</a>

            <div id="dropdownMenu"
                style="display:none;position:absolute;right:0;top:100%;background:white;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:140px;z-index:999;">
                <a href="taikhoan.html" style="display:block;padding:12px;color:#333;text-decoration:none;">Thông tin</a>
                <a href="#" id="logoutBtn" style="display:block;padding:12px;color:#e74c3c;text-decoration:none;">Đăng xuất</a>
            </div>
        </div>
    </nav>
</header>

<div class="detail-page">
    <div class="detail-container" id="detailContainer">
        <p>Đang tải dữ liệu...</p>
    </div>
</div>

<script type="module" src="js/chitiet.js?v=3"></script>y
    
<script type="module" src="js/notification.js"></script>

</body>
</html>
