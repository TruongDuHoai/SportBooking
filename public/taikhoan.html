<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .profile-container{
            max-width:900px;
            margin:40px auto;
            padding:0 20px;
        }

        .profile-card{
            background:#fff;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .profile-header{
            background:linear-gradient(135deg,#1a6b30,#0d4620);
            color:#fff;
            padding:35px;
            text-align:center;
        }

        .avatar{
            width:100px;
            height:100px;
            border-radius:50%;
            background:#ff9800;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
            font-weight:bold;
            margin:auto;
            margin-bottom:20px;
        }

        .profile-body{
            padding:30px;
        }

        .info-group{
            padding:15px 0;
            border-bottom:1px solid #eee;
        }

        .info-label{
            font-weight:600;
            color:#777;
            display:inline-block;
            width:160px;
        }

        .edit-btn,.save-btn,.cancel-btn{
            border:none;
            padding:12px 18px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        .edit-btn{
            background:#1a6b30;
            color:white;
            margin-top:20px;
        }

        .save-btn{
            background:#ff9800;
            color:white;
        }

        .cancel-btn{
            background:#ddd;
            margin-left:8px;
        }

        .edit-form{
            display:none;
            margin-top:20px;
        }

        .edit-form input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:8px;
        }

        .order-history{
            margin-top:30px;
        }

        .order-item{
            background:#fff;
            padding:18px;
            border-radius:14px;
            margin-bottom:12px;
            box-shadow:0 8px 20px rgba(0,0,0,.06);
        }
        
        .favorite-item{
            background:#fff;
            padding:18px;
            border-radius:14px;
            margin-bottom:12px;
            box-shadow:0 8px 20px rgba(0,0,0,.06);
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
        }

        .btn-rebook{
            background:#1a6b30;
            color:white;
            border:none;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        @media(max-width:768px){
            .info-label{
                display:block;
                width:100%;
                margin-bottom:6px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration:none;color:white;">
            <h1>SportBooking</h1>
        </a>
    </div>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="chitiet.html?id=san1">Đặt sân</a>
        <a href="doan.html">Đặt đồ ăn</a>
        <a href="giohang.html">Giỏ hàng</a>
        <a href="lichsu.html">Lịch sử</a>
        <a href="lienhe.html">Liên hệ</a>

        <div id="notificationBox" style="position:relative;display:none;">
            <a href="#" id="notificationBell" style="position:relative;">
                <i class="fas fa-bell"></i>
                <span id="notificationBadge"
                    style="
                        display:none;
                        position:absolute;
                        top:-8px;
                        right:-10px;
                        background:red;
                        color:white;
                        font-size:11px;
                        padding:2px 6px;
                        border-radius:50%;
                    ">
                    0
                </span>
            </a>

            <div id="notificationDropdown"
                style="
                    display:none;
                    position:absolute;
                    right:0;
                    top:35px;
                    width:320px;
                    background:white;
                    color:#333;
                    border-radius:10px;
                    box-shadow:0 5px 20px rgba(0,0,0,.15);
                    z-index:999;
                    overflow:hidden;
                ">
                <div style="padding:12px;font-weight:bold;border-bottom:1px solid #eee;">
                    Thông báo
                </div>

                <div id="notificationList" style="max-height:350px;overflow-y:auto;">
                    <p style="padding:15px;color:#777;">Chưa có thông báo.</p>
                </div>
            </div>
        </div>

        <a href="#" id="logoutBtnInProfile" style="color:#ffb3b3;">Đăng xuất</a>
    </nav>
</header>

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-header">
            <div class="avatar" id="avatarText">U</div>
            <h2 id="displayName">Đang tải...</h2>
            <p id="userEmail">---</p>
        </div>

        <div class="profile-body">

            <div class="info-group">
                <span class="info-label">Họ và tên:</span>
                <span id="infoFullName">---</span>
            </div>

            <div class="info-group">
                <span class="info-label">Email:</span>
                <span id="infoEmail">---</span>
            </div>

            <div class="info-group">
                <span class="info-label">Số điện thoại:</span>
                <span id="infoPhone">---</span>
            </div>

            

            <div class="info-group">
                <span class="info-label">Ngày tham gia:</span>
                <span id="infoCreatedAt">---</span>
            </div>

            <button class="edit-btn" id="editBtn">Chỉnh sửa thông tin</button>

            <div class="edit-form" id="editForm">
                <h3>Chỉnh sửa</h3>

                <input type="text" id="editFullName" placeholder="Họ và tên">
                <input type="tel" id="editPhone" placeholder="Số điện thoại">

                <button class="save-btn" id="saveBtn">Lưu</button>
                <button class="cancel-btn" id="cancelBtn">Hủy</button>
            </div>

        </div>
    </div>

    <div class="order-history">
        <h3>Sân yêu thích</h3>
        <div id="favoriteList"></div>
    </div>

    <div class="order-history">
        <h3>Lịch sử đặt sân gần đây</h3>
        <div id="orderList"></div>
    </div>

</div>

<script type="module" src="js/taikhoan.js"></script>

</body>
</html>
