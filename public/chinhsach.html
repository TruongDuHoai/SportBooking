<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chính sách - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .policy-container {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .policy-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .policy-header h2 {
            color: #1a6b30;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .policy-header p {
            color: #666;
            font-size: 16px;
        }

        .policy-grid {
            display: grid;
            gap: 24px;
        }

        .policy-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 10px 26px rgba(0,0,0,0.07);
            border: 1px solid #f0f0f0;
        }

        .policy-card h2 {
            color: #1a6b30;
            font-size: 23px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .policy-card h2 i {
            color: #ff9800;
        }

        .policy-card h3 {
            color: #333;
            margin: 18px 0 8px;
        }

        .policy-card p,
        .policy-card li {
            color: #666;
            line-height: 1.7;
            margin: 8px 0;
        }

        .policy-card ul {
            padding-left: 22px;
        }

        .policy-highlight {
            background: #fff8ec;
            border-left: 4px solid #ff9800;
            padding: 14px;
            border-radius: 10px;
            margin-top: 15px;
            color: #555;
        }

        @media(max-width: 768px) {
            .policy-header h2 {
                font-size: 26px;
            }

            .policy-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration:none;color:white;">
                <h1>SportBooking</h1>
            </a>
        </div>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="chitiet.html?id=san1">Đặt sân</a>
            <a href="doan.html">Đặt đồ ăn</a>
            <a href="giohang.html">Giỏ hàng</a>
            <a href="lichsu.html">Lịch sử</a>
            <a href="lienhe.html">Liên hệ</a>

            <div id="userMenu" style="position:relative;display:inline-block;">
                <a href="#" id="loginBtn">Đăng nhập</a>

                <div id="userDropdownArea" style="display:none;position:relative;">
                    <a href="#" id="userInfoBtn">Tài khoản</a>

                    <div id="dropdownMenu" style="display:none;position:absolute;right:0;top:100%;background:white;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:140px;z-index:100;">
                        <a href="taikhoan.html" style="display:block;padding:12px;color:#333;text-decoration:none;">Thông tin</a>
                        <a href="#" id="logoutBtn" style="display:block;padding:12px;color:#e74c3c;text-decoration:none;">Đăng xuất</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="policy-container">

    <div id="policyList">

    </div>

</div>
    <footer>
        <div class="footer-content">
            <div>
                <h4>Liên hệ</h4>
                <p>Hotline: 1900 1234</p>
                <p>Email: support@sportbooking.com</p>
            </div>

            <div>
                <h4>Chính sách</h4>
                <p><a href="chinhsach.html">Chính sách đặt sân</a></p>
                <p><a href="chinhsach.html#hoantien">Chính sách hủy đặt</a></p>
            </div>

            <div>
                <h4>Theo dõi</h4>
                <p><i class="fab fa-facebook"></i> Facebook</p>
                <p><i class="fab fa-instagram"></i> Instagram</p>
            </div>
        </div>

        <p class="copyright">&copy; 2025 SportBooking - Đặt sân bóng trực tuyến</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0qNvl-i24wG9wOH-ajLu77MxNFvMvwjU",
            authDomain: "thue-san-the-thao.firebaseapp.com",
            projectId: "thue-san-the-thao",
            storageBucket: "thue-san-the-thao.firebasestorage.app",
            messagingSenderId: "90803956356",
            appId: "1:90803956356:web:7c63edc595f6ad25acb0d1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginBtn = document.getElementById("loginBtn");
        const userDropdownArea = document.getElementById("userDropdownArea");
        const userInfoBtn = document.getElementById("userInfoBtn");
        const dropdownMenu = document.getElementById("dropdownMenu");
        const logoutBtn = document.getElementById("logoutBtn");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginBtn.style.display = "none";
                userDropdownArea.style.display = "inline-block";

                userInfoBtn.onclick = (e) => {
                    e.preventDefault();
                    dropdownMenu.style.display =
                        dropdownMenu.style.display === "none" ? "block" : "none";
                };
            } else {
                loginBtn.style.display = "inline";
                userDropdownArea.style.display = "none";

                loginBtn.onclick = (e) => {
                    e.preventDefault();
                    window.location.href = "dangnhap.html";
                };
            }
        });

        logoutBtn.onclick = async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = "index.html";
        };
async function loadPolicies() {

    const container =
        document.getElementById("policyList");

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "policies"
                )
            );

        let html = "";

        snapshot.forEach(docSnap => {

            const data =
                docSnap.data();

            html += `
                <div class="policy-card">
                    <h2>${data.title}</h2>
                    <p>${data.content}</p>
                </div>
            `;
        });

        container.innerHTML = html;

    } catch(error){

        console.error(
            "Lỗi tải chính sách:",
            error
        );
    }
}
        document.addEventListener("click", (e) => {
            if (
                userDropdownArea &&
                dropdownMenu &&
                !userDropdownArea.contains(e.target)
            ) {
                dropdownMenu.style.display = "none";
            }
        }); loadPolicies();
    </script>
</body>
</html>
