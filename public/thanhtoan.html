<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - SportBooking</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .checkout-container{
            max-width:900px;
            margin:40px auto;
            padding:0 20px;
        }

        .checkout-title{
            font-size:28px;
            margin-bottom:25px;
            color:#1a6b30;
        }

        .checkout-card{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,.06);
        }

        .order-item{
            display:flex;
            justify-content:space-between;
            padding:15px 0;
            border-bottom:1px solid #eee;
        }

        .order-total{
            margin-top:20px;
            font-size:22px;
            font-weight:700;
            text-align:right;
        }

        .order-total span{
            color:#e74c3c;
        }

        .form-group{
            margin-top:16px;
        }

        .form-group input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
        }

        .payment-methods{
            margin-top:20px;
        }

        .payment-methods label{
            display:flex;
            gap:10px;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            margin-bottom:12px;
            cursor:pointer;
        }

        .payment-methods label:hover{
            border-color:#1a6b30;
        }

        .btn-submit{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        .btn-main{
            background:#1a6b30;
            color:white;
        }

        .btn-back{
            background:#f5f5f5;
        }

        .empty-cart{
            text-align:center;
            padding:50px;
            background:white;
            border-radius:20px;
        }

        @media(max-width:768px){
            .order-item{
                flex-direction:column;
            }

            .order-total{
                text-align:left;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration:none;color:white;">
            <h1>SportBooking</h1>
        </a>
    </div>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="chitiet.html?id=san1">Đặt sân</a>
        <a href="doan.html">Đặt đồ ăn</a>
        <a href="giohang.html">Giỏ hàng</a>
        <a href="lichsu.html">Lịch sử</a>

        <div id="userMenu" style="position:relative;display:inline-block;">
            <a href="#" id="loginBtn">Đăng nhập</a>

            <div id="userDropdownArea" style="display:none;position:relative;">
                <a href="#" id="userInfoBtn">Tài khoản</a>

                <div id="dropdownMenu" style="display:none;position:absolute;right:0;top:100%;background:white;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:140px;">
                    <a href="taikhoan.html" style="display:block;padding:12px;color:#333;text-decoration:none;">Thông tin</a>
                    <a href="#" id="logoutBtn" style="display:block;padding:12px;color:#e74c3c;text-decoration:none;">Đăng xuất</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<div class="checkout-container">
    <h2 class="checkout-title">Thanh toán</h2>

    <div id="checkoutContent">
        <div class="empty-cart">
            <p>Đang tải thông tin...</p>
        </div>
    </div>
</div>

<script type="module" src="js/thanhtoan.js"></script>

</body>
</html>
