<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đặt sân - SportBooking</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .history-container{
            max-width:1200px;
            margin:40px auto;
            padding:0 20px;
        }

        .history-header{
            margin-bottom:25px;
        }

        .history-header h2{
            color:#1a6b30;
            margin-bottom:10px;
        }

        .filter-bar{
            display:flex;
            gap:15px;
            align-items:center;
            background:white;
            padding:20px;
            border-radius:16px;
            box-shadow:0 8px 25px rgba(0,0,0,.06);
            margin-bottom:25px;
        }

        .filter-bar input,
        .filter-bar select{
            width:260px;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
        }

        .booking-card{
            background:white;
            border-radius:16px;
            padding:20px;
            margin-bottom:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.06);
        }

        .booking-top{
            display:flex;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:20px;
        }

        .booking-info h3{
            color:#1a6b30;
            margin-bottom:10px;
        }

        .booking-info p{
            margin:8px 0;
            color:#666;
        }

        .status{
            padding:8px 14px;
            border-radius:999px;
            font-weight:600;
            font-size:14px;
        }

        .status.success{
            background:#d4edda;
            color:#155724;
        }

        .status.pending{
            background:#fff3cd;
            color:#856404;
        }

        .status.cancel{
            background:#f8d7da;
            color:#721c24;
        }

        .booking-actions{
            margin-top:20px;
            display:flex;
            gap:10px;
        }

        .btn{
            padding:10px 16px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        .btn-rebook{
            background:#1a6b30;
            color:white;
        }

        .btn-cancel{
            background:#e74c3c;
            color:white;
        }

        .empty-box{
            background:white;
            padding:40px;
            border-radius:16px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,.05);
        }

        @media(max-width:768px){
            .booking-top{
                flex-direction:column;
            }

            .booking-actions{
                flex-direction:column;
            }

            .btn{
                width:100%;
            }

            .filter-bar{
                flex-direction:column;
                align-items:stretch;
            }

            .filter-bar input,
            .filter-bar select{
                width:100%;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html" style="text-decoration:none;color:white;">
            <h1>SportBooking</h1>
        </a>
    </div>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="chitiet.html?id=san1">Đặt sân</a>
        <a href="doan.html">Đặt đồ ăn</a>
        <a href="giohang.html">Giỏ hàng</a>
        <a href="lichsu.html">Lịch sử</a>
        <a href="lienhe.html">Liên hệ</a>

        <!-- CHUÔNG THÔNG BÁO -->
        <div id="notificationBox" style="position:relative;display:none;margin-right:15px;">
            <a href="#" id="notificationBell" style="position:relative;color:white;font-size:20px;">
                <i class="fas fa-bell"></i>
                <span id="notificationBadge"
                    style="
                        display:none;
                        position:absolute;
                        top:-8px;
                        right:-8px;
                        background:red;
                        color:white;
                        min-width:18px;
                        height:18px;
                        border-radius:50%;
                        font-size:11px;
                        justify-content:center;
                        align-items:center;
                    ">
                    0
                </span>
            </a>

            <div id="notificationDropdown"
                style="
                    display:none;
                    position:absolute;
                    right:0;
                    top:35px;
                    width:330px;
                    background:white;
                    color:#333;
                    border-radius:10px;
                    box-shadow:0 8px 20px rgba(0,0,0,.2);
                    z-index:9999;
                    overflow:hidden;
                ">
                <div style="padding:12px;font-weight:bold;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
                    <span>Thông báo</span>
                    <button id="markAllNotificationsReadBtn" style="border:none;background:none;color:#1a6b30;cursor:pointer;">
                        Đánh dấu tất cả
                    </button>
                </div>

                <div id="notificationList" style="max-height:350px;overflow-y:auto;">
                    <p style="padding:15px;color:#777;">Chưa có thông báo.</p>
                </div>
            </div>
        </div>

        <div id="userMenu" style="position:relative;display:inline-block;">
            <a href="#" id="loginBtn">Đăng nhập</a>

            <div id="userDropdownArea" style="display:none;position:relative;">
                <a href="#" id="userInfoBtn">Tài khoản</a>

                <div id="dropdownMenu" style="display:none;position:absolute;right:0;top:100%;background:white;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:140px;">
                    <a href="taikhoan.html" style="display:block;padding:12px;color:#333;text-decoration:none;">Thông tin</a>
                    <a href="#" id="logoutBtn" style="display:block;padding:12px;color:#e74c3c;text-decoration:none;">Đăng xuất</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<div class="history-container">

    <div class="history-header">
        <h2>Lịch sử đặt sân</h2>
        <p>Theo dõi toàn bộ đơn đặt sân của bạn</p>
    </div>

    <div class="filter-bar">
        <input
            type="text"
            id="historySearch"
            placeholder="Tìm sân, ngày, trạng thái..."
        >

        <select id="filterStatus">
            <option value="all">Tất cả trạng thái</option>
            <option value="chờ_xác_nhận">Chờ xác nhận</option>
            <option value="đã_xác_nhận">Đã xác nhận</option>
            <option value="đã_hủy">Đã hủy</option>
        </select>
    </div>

    <div id="bookingList"></div>

</div>

<script type="module" src="js/lichsu.js"></script>
<script type="module" src="js/notification.js"></script>

</body>
</html>
